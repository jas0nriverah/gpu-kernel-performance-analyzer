[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-kernel-performance-analyzer"
version = "0.1.0"
description = "CUDA/C++ kernel benchmarking with Python artifact validation and analysis."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jason Rivera-Hernandez" }]
keywords = [
    "cuda",
    "gpu",
    "benchmarking",
    "performance",
    "roofline",
    "nsight-compute",
    "hpc",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Benchmark",
]
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.24",
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/jas0nriverah/gpu-kernel-performance-analyzer"
Repository = "https://github.com/jas0nriverah/gpu-kernel-performance-analyzer"
Issues = "https://github.com/jas0nriverah/gpu-kernel-performance-analyzer/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
power = ["pandas>=2.0", "scikit-learn>=1.3", "joblib>=1.3"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "httpx>=0.27"]
boosting = ["xgboost>=2.0", "lightgbm>=4.0", "shap>=0.44"]
tracking = ["mlflow>=2.12", "wandb>=0.17"]
torch = ["torch>=2.2"]
lint = ["ruff>=0.6"]
ml = ["scikit-learn>=1.3"]

[project.scripts]
gpu-kernel-analyzer = "gpu_kernel_analyzer.cli:main"
gpu-power-pipeline = "gpu_power_pipeline.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/gpu_power_pipeline/*" = ["UP", "B008"]
"tests/power/*" = ["UP", "B"]
