<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">How the selected GPU power model predicts</title><desc id="desc">Actual known-device pipeline: strict serving validation, training-only numerical and categorical preprocessing, a 64-tree random forest, mean prediction in watts, and monitoring. Tree icons are conceptual.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#60768a"/></marker></defs>
<rect width="1200" height="820" fill="white"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
<text x="40" y="47" font-size="31" font-weight="700" fill="#142638" text-anchor="start">How the selected power model predicts</text>
<text x="40" y="78" font-size="18" font-weight="400" fill="#506578" text-anchor="start">rf_unbounded_full · known H100/H200 devices · one telemetry row → one prediction</text>
<rect x="40" y="103" width="1120" height="66" rx="15" fill="#edf8f5" stroke="#b4d9d0"/>
<text x="60" y="130" font-size="14" font-weight="700" fill="#087f8c" text-anchor="start">LIVE API GATE</text>
<text x="220" y="130" font-size="17" font-weight="400" fill="#142638" text-anchor="start">Validate required fields, finite values, physical ranges and approved GPU name.</text>
<text x="220" y="153" font-size="15" font-weight="400" fill="#506578" text-anchor="start">Reject unsupported devices before preprocessing; offline evaluation is a separate path.</text>
<rect x="40" y="207" width="230" height="371" rx="15" fill="#f5f8fc" stroke="#d5e0ea"/>
<rect x="305" y="207" width="260" height="371" rx="15" fill="#f5f8fc" stroke="#d5e0ea"/>
<rect x="600" y="207" width="320" height="371" rx="15" fill="#f5f8fc" stroke="#d5e0ea"/>
<rect x="955" y="207" width="205" height="371" rx="15" fill="#f5f8fc" stroke="#d5e0ea"/>
<text x="58" y="239" font-size="15" font-weight="700" fill="#3158a8" text-anchor="start">1  TELEMETRY</text>
<text x="58" y="271" font-size="19" font-weight="700" fill="#142638" text-anchor="start">Five numeric inputs</text>
<text x="58" y="303" font-size="16" font-weight="400" fill="#506578" text-anchor="start">GPU utilization (%)</text>
<text x="58" y="330" font-size="16" font-weight="400" fill="#506578" text-anchor="start">Memory utilization (%)</text>
<text x="58" y="357" font-size="16" font-weight="400" fill="#506578" text-anchor="start">Graphics clock (MHz)</text>
<text x="58" y="384" font-size="16" font-weight="400" fill="#506578" text-anchor="start">Memory clock (MHz)</text>
<text x="58" y="411" font-size="16" font-weight="400" fill="#506578" text-anchor="start">Temperature (°C)</text>
<text x="58" y="465" font-size="17" font-weight="700" fill="#142638" text-anchor="start">Two categorical inputs</text>
<text x="58" y="495" font-size="16" font-weight="400" fill="#506578" text-anchor="start">Workload type</text>
<text x="58" y="522" font-size="16" font-weight="400" fill="#506578" text-anchor="start">GPU name</text>
<text x="325" y="239" font-size="15" font-weight="700" fill="#3158a8" text-anchor="start">2  PREPROCESS</text>
<text x="325" y="274" font-size="20" font-weight="700" fill="#142638" text-anchor="start">ColumnTransformer</text>
<rect x="323" y="294" width="224" height="94" rx="10" fill="#edf4fd" stroke="#c8d8ed"/>
<text x="338" y="320" font-size="16" font-weight="700" fill="#3158a8" text-anchor="start">Numeric branch</text>
<text x="338" y="346" font-size="16" font-weight="400" fill="#506578" text-anchor="start">Median imputation</text>
<text x="338" y="371" font-size="16" font-weight="400" fill="#506578" text-anchor="start">StandardScaler</text>
<rect x="323" y="405" width="224" height="108" rx="10" fill="#f2eef8" stroke="#dacee9"/>
<text x="338" y="432" font-size="16" font-weight="700" fill="#7454a0" text-anchor="start">Categorical branch</text>
<text x="338" y="457" font-size="15" font-weight="400" fill="#506578" text-anchor="start">Most-frequent imputation</text>
<text x="338" y="482" font-size="15" font-weight="400" fill="#506578" text-anchor="start">One-hot encoding</text>
<text x="325" y="548" font-size="14" font-weight="400" fill="#506578" text-anchor="start">Statistics learned on train only</text>
<text x="620" y="239" font-size="15" font-weight="700" fill="#3158a8" text-anchor="start">3  RANDOM FOREST</text>
<text x="620" y="271" font-size="21" font-weight="700" fill="#142638" text-anchor="start">64 regression trees</text>
<text x="651" y="311" font-size="14" font-weight="400" fill="#506578" text-anchor="middle">Tree 1</text>
