<text x="760" y="517" font-size="15" font-weight="400" fill="#087f8c" text-anchor="middle">ŷ = (T₁(x) + … + T₆₄(x)) / 64</text>
<text x="620" y="553" font-size="14" font-weight="400" fill="#506578" text-anchor="start">Tree sketches are conceptual.</text>
<text x="975" y="239" font-size="15" font-weight="700" fill="#3158a8" text-anchor="start">4  OUTPUT</text>
<text x="1058" y="320" font-size="35" font-weight="700" fill="#087f8c" text-anchor="middle">Watts</text>
<text x="1058" y="351" font-size="15" font-weight="400" fill="#506578" text-anchor="middle">GPU sensor estimate</text>
<text x="975" y="408" font-size="15" font-weight="400" fill="#506578" text-anchor="start">Pinned model identity</text>
<text x="975" y="438" font-size="15" font-weight="400" fill="#506578" text-anchor="start">Finite output check</text>
<text x="975" y="468" font-size="15" font-weight="400" fill="#506578" text-anchor="start">Prediction log</text>
<text x="975" y="498" font-size="15" font-weight="400" fill="#506578" text-anchor="start">Drift + service metrics</text>
<text x="975" y="550" font-size="14" font-weight="400" fill="#506578" text-anchor="start">No confidence interval</text>
<path d="M270 393L305 393" fill="none" stroke="#60768a" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M565 393L600 393" fill="none" stroke="#60768a" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M920 393L955 393" fill="none" stroke="#60768a" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="40" y="609" width="1120" height="77" rx="15" fill="#f2f5fa" stroke="#d5e0ea"/>
<text x="60" y="637" font-size="14" font-weight="700" fill="#3158a8" text-anchor="start">FROZEN TRAINING CONTRACT</text>
<text x="60" y="664" font-size="18" font-weight="400" fill="#142638" text-anchor="start">64 trees · min_samples_leaf=3 · max_depth=None · random_state=42 · n_jobs=1</text>
<text x="40" y="727" font-size="17" font-weight="400" fill="#142638" text-anchor="start">Fit preprocessing and trees inside each training fold; freeze the selected pipeline before the later H200 capture.</text>
<text x="40" y="756" font-size="16" font-weight="400" fill="#506578" text-anchor="start">Targets are individual steady power samples. Trial aggregates summarize measurements; they are not the ML rows.</text>
<text x="40" y="787" font-size="15" font-weight="400" fill="#506578" text-anchor="start">No fitted-tree visualization, feature attribution, uncertainty calibration or causal explanation is claimed.</text>
</g></svg>
